name: Build HyperMania Alpha 02.12.24 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - hypermania-alpha-02-12-24-arm64
  pull_request:
    branches:
      - main

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye

    steps:
      - name: Checkout HyperMania Alpha 02.12.24
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install dependencies
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye-updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260610T000000Z/ bullseye-security main' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y build-essential cmake git ca-certificates zip file binutils

      - name: Checkout pinned GameAPI and SHCLogo submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Build ARM64 HyperMania
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRELEASE=ON \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2" \
            -DCMAKE_CXX_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2"
          cmake --build build --config Release --parallel

      - name: Verify ARM64 binary
        run: |
          test -f build/hypermania.so
          file build/hypermania.so
          readelf -h build/hypermania.so | grep -E 'Class:|Machine:'
          file build/hypermania.so | grep -E 'ARM aarch64|AArch64|ARM64'

      - name: Package RG34XX mod
        run: |
          rm -rf release
          mkdir -p release/HyperMania/Data
          cp mod.ini release/HyperMania/mod.ini
          cp build/hypermania.so release/HyperMania/hypermania.so
          cp -r Data/. release/HyperMania/Data/
          [ -f MANUAL.md ] && cp MANUAL.md release/HyperMania/MANUAL.md || true
          cat > release/HyperMania/BUILD_INFO.txt <<'EOF'
HyperMania Alpha 02.12.24 ARM64 build
Source: tariq-nasheed/HyperMania commit debd785c66b16bcf2e70408ae44a6c44b8418720
Target: ARM64 / AArch64 Linux
EOF
          cd release
          zip -r ../HyperMania-Alpha-02.12.24-ARM64.zip HyperMania

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: HyperMania-Alpha-02.12.24-ARM64
          path: HyperMania-Alpha-02.12.24-ARM64.zip
