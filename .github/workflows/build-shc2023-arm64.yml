name: Build SHC2023 HyperMania ARM64

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye

    steps:
      - name: Install dependencies
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260610T000000Z/ bullseye-updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20260610T000000Z/ bullseye-security main' \
            > /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install -y build-essential cmake git ca-certificates curl file unzip zip

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Save official SHC2023 legacy GameConfig.bin
        run: |
          mkdir -p /tmp/hm-legacy
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/sdsdsdsrj4rjj/wwfgfdgreggreghfgrgrgv/main/%5BSHC%5D%20%5Bcontest2023%5D%20885%20-%20HYPERMANIA%20%28Sonic%20Mania%20Decomp%20Mod%29%20%28By%20CBTBSD%29%20-%20Linux%20%28Legacy%29.zip' \
            -o /tmp/hm-legacy/hypermania-shc2023-linux-legacy.zip
          unzip -l /tmp/hm-legacy/hypermania-shc2023-linux-legacy.zip | grep -i 'GameConfig.bin'
          unzip -q /tmp/hm-legacy/hypermania-shc2023-linux-legacy.zip -d /tmp/hm-legacy/unpacked
          GAMECONFIG="$(find /tmp/hm-legacy/unpacked -type f -iname 'GameConfig.bin' -print -quit)"
          test -n "$GAMECONFIG"
          cp "$GAMECONFIG" /tmp/hm-legacy/GameConfig.bin

      - name: Clone exact SHC2023 source
        run: |
          rm -rf /tmp/HyperMania
          git clone --recursive https://github.com/tariq-nasheed/HyperMania.git /tmp/HyperMania
          cd /tmp/HyperMania
          git checkout --detach 70ec09f17a40ee552a133546834d522aadd368c5
          git submodule update --init --recursive

      - name: Build HyperMania ARM64
        working-directory: /tmp/HyperMania
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2" \
            -DCMAKE_CXX_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2"
          cmake --build build --config Release --parallel

      - name: Build matching SHCLogo ARM64
        working-directory: /tmp/HyperMania/src/SHCLogo-RSDKv5Decomp
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2" \
            -DCMAKE_CXX_FLAGS="-O2 -DNDEBUG -DRETRO_REVISION=2 -DRETRO_MOD_LOADER_VER=2"
          cmake --build build --config Release --parallel

      - name: Verify ARM64 outputs
        run: |
          test -f /tmp/HyperMania/build/hypermania.so
          test -f /tmp/HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so
          file /tmp/HyperMania/build/hypermania.so
          file /tmp/HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so
          readelf -h /tmp/HyperMania/build/hypermania.so | grep -E 'Class:|Machine:'
          readelf -h /tmp/HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so | grep -E 'Class:|Machine:'

      - name: Package
        run: |
          rm -rf release
          mkdir -p release/HyperMania/Data/Game
          cp /tmp/HyperMania/mod.ini release/HyperMania/mod.ini
          cp /tmp/HyperMania/build/hypermania.so release/HyperMania/hypermania.so
          cp /tmp/HyperMania/src/SHCLogo-RSDKv5Decomp/build/SHCLogo.so release/HyperMania/SHCLogo.so
          cp -r /tmp/HyperMania/Data/. release/HyperMania/Data/
          cp /tmp/hm-legacy/GameConfig.bin release/HyperMania/Data/Game/GameConfig.bin
          test -f release/HyperMania/Data/Game/Game.xml
          test -f release/HyperMania/Data/Game/GameConfig.bin
          test -f release/HyperMania/Data/Stages/HPZ/Scene1.bin
          test -f release/HyperMania/Data/Stages/HPZ/StageConfig.bin
          test -f release/HyperMania/Data/Stages/HPZ/TileConfig.bin
          cp /tmp/HyperMania/MANUAL.md release/HyperMania/MANUAL.md
          printf '%s\n' \
            'Official SHC2023 HyperMania ARM64 test build' \
            'Source commit: 70ec09f17a40ee552a133546834d522aadd368c5' \
            'Includes both the SHC2023 Game.xml stage registration and Legacy GameConfig.bin' \
            > release/HyperMania/BUILD_INFO.txt
          cd release
          zip -r ../HyperMania-SHC2023-ARM64-Test.zip HyperMania

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperMania-SHC2023-ARM64-Test
          path: HyperMania-SHC2023-ARM64-Test.zip
